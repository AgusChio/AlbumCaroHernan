<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tree contact sheet</title>
    <style>
      :root { --color-bg: #faf6ec; --color-primary: #a3c293; --color-text: #4a4a3b; --color-blossom: #eba8b6; --color-blossom-deep: #d0808f; }
      body { margin: 0; background: var(--color-bg); font: 12px system-ui; color: var(--color-text); }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; padding: 8px; }
      figure { margin: 0; position: relative; height: 240px; border: 1px solid #eee5d3; }
      figure.tall { height: 420px; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      figcaption { position: absolute; left: 6px; top: 4px; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="/src/tree/sheet.ts"></script>
  </body>
</html>
